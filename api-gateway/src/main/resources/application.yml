server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # CORS so the browser frontend (Vite dev server, etc.) can call the gateway.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "${FRONTEND_ORIGIN:http://localhost:*}"
              - "http://localhost:*"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: customer-service
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/customers/**

        - id: account-service
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/accounts/**

        - id: transaction-service
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/transactions/**

        # ---- Routes for services added in later phases ----
        # Uncomment each route once that service exists and is registered in Eureka.
        - id: transfer-service
          uri: lb://TRANSFER-SERVICE
          predicates:
            - Path=/api/transfers/**
        - id: loan-service
          uri: lb://LOAN-SERVICE
          predicates:
            - Path=/api/loans/**
        - id: card-service
          uri: lb://CARD-SERVICE
          predicates:
            - Path=/api/cards/**
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**

# Edge auth mode: "jwt" = custom HS256 from auth-service (local default),
# "keycloak" = validate Keycloak OIDC tokens via JWKS (cloud).
gateway:
  auth-mode: ${GATEWAY_AUTH_MODE:jwt}

# MUST be identical to the secret in auth-service. (Used when auth-mode=jwt.)
jwt:
  secret: ${JWT_SECRET:ChangeThisSecretToA64CharacterLongRandomStringForProductionUse12345}

# Keycloak realm (only used when gateway.auth-mode=keycloak).
keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/noor-bank}
  jwks-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/noor-bank/protocol/openid-connect/certs}

# Stamped on every forwarded request so downstream services can verify the call
# came through the gateway. MUST be identical to internal.shared-secret in every service.
internal:
  shared-secret: ${INTERNAL_SHARED_SECRET:local-dev-internal-secret-change-me}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

logging:
  level:
    org.springframework.cloud.gateway: INFO
